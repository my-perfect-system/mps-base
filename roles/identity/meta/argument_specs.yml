---
argument_specs:
  main:
    short_description: Shared identity model for the odem.* ecosystem
    description:
      - Resolves users from users_catalog + users_list into a unified structure.
      - Produces identity_users_resolved, identity_users_present, identity_users_absent, identity_user_groups.
      - Declared as a meta dependency by every per-user role in odem.* ecosystem.
      - Callers pass users_catalog and users_list as role vars; they flow through the play scope
        to this role via the dependency chain.
    options:
      users_catalog:
        type: dict
        required: false
        default: {}
        description:
          - Identity catalog keyed by a free-form unique id. Keys are NOT validated against
            a fixed set; they are only used to reference entries from users_list.
          - The real OS username is taken from each entry's name field. If name is omitted,
            it defaults to the catalog key (the unique id).
          - Each value is a dict describing a single user entity. The top-level keys are
            arbitrary identifiers, so per-entity field validation cannot be expressed via
            argument_spec options (Ansible's dict+options validates the dict keys, not the
            values). The supported per-entity schema is documented here for reference.
          - 'Per-entity supported fields:'
          - 'name (str)         — OS username. Defaults to the catalog key when omitted.'
          - 'uid (int)          — Numeric UID. Omit to let the OS pick.'
          - 'group (str)        — Primary group name. Created automatically if not present.'
          - 'groups (list[str]) — Supplementary group memberships to add to the user.'
          - 'append_groups (bool) — When true, append to existing group memberships; when false, replace.'
          - 'comment (str)      — GECOS field (human-readable name / description).'
          - 'shell (str)        — Login shell (absolute path).'
          - 'home (str)         — Home directory path.'
          - 'create_home (bool) — Whether to create the home directory.'
          - 'system (bool)      — Create as a system account (UID below SYS_UID_MAX).'
          - 'expires (float)    — Account expiry epoch. Use -1 to disable expiry.'
          - 'password (str)     — Plaintext password. If empty, a random password is generated.
            odem.users.users hashes it with sha512 before passing to the user module.'
          - 'ssh_keys (list[dict]) — Per-user SSH private/public key files to deploy to ~/.ssh/.
            Each entry supports: name (str), content (str, optional), path (str, optional).'
          - 'authorized_keys (list[dict]) — Public keys to concatenate into ~/.ssh/authorized_keys.
            Each entry supports: content (str, optional), path (str, optional).'
          - 'sudo (dict)        — Sudoers configuration for this user. See odem.users.sudo for
            full semantics. Supported keys: nopasswd (bool), group (bool), macros (list[str]).'
          - 'user_roles (dict)  — Per-user role opt-in flags. Each key is a `<collection>_<role>`
            flag (e.g. terminal_bash, desktop_qtile, development_opencode). Per-user roles
            filter identity_users_resolved by these flags. Reference user_roles_default /
            user_roles_minimal from defaults to opt into a standard role set.'
      users_list:
        type: list
        required: false
        default: []
        description:
          - Assignment list. Each entry references a users_catalog key via name and sets state.
          - No other fields are read from users_list entries; all identity comes from the catalog.
        elements: dict
        options:
          name:
            type: str
            required: true
            description:
              - Unique id of the user. Must match a key in users_catalog.
              - The actual OS username is read from the catalog entry's name field (defaulting to this id).
          state:
            type: str
            choices: [present, absent]
            default: present
            description: Whether the user should exist on this host.
