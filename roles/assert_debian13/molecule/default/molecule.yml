---
# Molecule scenario for odem.base.assert_debian13.
# Generated by manage/gen_molecule_scenarios.py.
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: odem-base-assert_debian13
    image: geerlingguy/docker-debian13-ansible:latest
    privileged: false
    pre_build_image: false
    command: /bin/sh -c "while true; do sleep 1000; done"

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  inventory:
    group_vars:
      all:
        ansible_user: root
        # users_catalog is filled in converge.yml per-role

verifier:
  name: ansible
  playbooks:
    verify: verify.yml
