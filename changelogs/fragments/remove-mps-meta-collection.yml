---
release_summary: |
  The `odem.meta` composition-only collection has been removed from the ecosystem. Cross-collection composition now lives as 7 flat `import_playbook` chain playbooks under `examples/inventories/home/playbooks/` (`bootstrap.yml`, `terminal_{min,full}.yml`, `desktop_{min,full}.yml`, `workstation_{min,full}.yml`). Run via `just run-example <env> <inventory> <playbook>`. `manage/Justfile` `REPOS` updated; `manage/AGENTS.md` Repos table updated.
